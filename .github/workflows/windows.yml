name: Build Windows portable

on:
  push:
    branches: [main, 'gpt/first-prototype']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build portable application
        run: python packaging/build_windows.py
      - name: Verify EXE with bundled Git
        run: python packaging/verify_bundle.py dist/GitHug build/windows-smoke.json
      - name: Upload Windows application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GitHug-Windows-x64
          path: dist/GitHug/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GitHug-build-diagnostics
          path: |
            build/windows-smoke.json
            dist/*.sha256
            build/pyinstaller/GitHug/warn-GitHug.txt
          if-no-files-found: ignore
