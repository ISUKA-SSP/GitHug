name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [gpt/release-v1.1.1]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Rebuild official PyInstaller bootloader
        run: python packaging/rebuild_bootloader.py
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Verify source GUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -m gittotte --smoke-test build/source-smoke.json
          Get-Content build/source-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable application
        run: python packaging/build_windows.py
      - name: Scan current distribution with Defender
        shell: pwsh
        run: |
          ./packaging/scan_windows.ps1 -Target dist/GitTotte -Report build/security/current-folder.json
          ./packaging/scan_windows.ps1 -Target dist/GitTotte-1.1.1-Windows-x64.zip -Report build/security/current-zip.json
      - name: Verify EXE with bundled Git
        run: python packaging/verify_bundle.py dist/GitTotte build/windows-smoke.json
      - name: Upload Windows application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GitTotte-Windows-x64
          path: dist/GitTotte/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload release ZIP and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GitTotte-release-files
          path: |
            dist/GitTotte-1.1.1-Windows-x64.zip
            dist/GitTotte-1.1.1-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GitTotte-build-diagnostics
          path: |
            build/source-smoke.json
            build/source-smoke.png
            build/source-smoke-terminal.png
            build/windows-smoke.json
            build/windows-smoke.png
            build/windows-smoke-terminal.png
            build/bootloader-build.json
            build/security/
            dist/*.sha256
            build/pyinstaller/GitTotte/warn-GitTotte.txt
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/gpt/release-v1.1.1'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: GitTotte-release-files
          path: release-files
      - uses: actions/download-artifact@v8.0.2
        with:
          name: GitTotte-build-diagnostics
          path: diagnostics
      - name: Verify publication inputs
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import hashlib
          def read_report(name):
              paths=list(Path('diagnostics').rglob(name))
              assert len(paths)==1,(name,paths)
              return json.loads(paths[0].read_text(encoding='utf-8-sig'))
          source=read_report('source-smoke.json')
          frozen=read_report('windows-smoke.json')
          for report in (source,frozen):
              assert report['version']=='1.1.1' and report['gui_initialized'] and not report['callback_errors']
          assert frozen['frozen'] and frozen['git_roundtrip'] and frozen['console_interactive']
          for name in ('current-folder','current-zip'):
              report=read_report(name+'.json')
              assert report['status']=='no_detection'
          archive=Path('release-files/GitTotte-1.1.1-Windows-x64.zip')
          checksum=archive.with_suffix('.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==checksum
          PYCODE
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.1.1 release-files/GitTotte-1.1.1-Windows-x64.zip release-files/GitTotte-1.1.1-Windows-x64.sha256 --target "$GITHUB_SHA" --title "GitTotte v1.1.1" --notes-file docs/releases/v1.1.1.md --latest
